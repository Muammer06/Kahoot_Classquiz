#
# Calistirmak icin: ./docker/run.sh
# (ROOT_ADDRESS otomatik; kalici JWT icin .docker-state/secret_key)
# Dis port: PUBLIC_HTTP_PORT=8080 (varsayilan 8080; eski 8000 icin PUBLIC_HTTP_PORT=8000)

services:
  frontend:
    restart: always
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - redis
      - api
    environment:
      REDIS_URL: redis://redis:6379/0?decode_responses=True
      API_URL: http://api:80

  api:
    build: &build_cfg
      context: .
      dockerfile: Dockerfile
    restart: &restart always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      meilisearch:
        condition: service_started
    env_file:
      - docker/stack.env
    volumes:
      - ./uploads:/app/data
    environment: &env_vars
      DB_URL: postgresql://postgres:classquiz@db:5432/classquiz
      REDIS: redis://redis:6379/0?decode_responses=True
      MAX_WORKERS: "1"
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      MEILISEARCH_URL: http://meilisearch:7700
      STORAGE_BACKEND: local
      STORAGE_PATH: /app/data
      ROOT_ADDRESS: ${ROOT_ADDRESS:-http://127.0.0.1:8000}
      SECRET_KEY: ${SECRET_KEY:-insecure-bootstrap-use-docker-run-sh-for-stable-secret}

  worker:
    build: *build_cfg
    restart: *restart
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      meilisearch:
        condition: service_started
    env_file:
      - docker/stack.env
    volumes:
      - ./uploads:/app/data
    environment: *env_vars
    command: arq classquiz.worker.WorkerSettings

  redis:
    image: redis:alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]

  db:
    image: postgres:14-alpine
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_PASSWORD: classquiz
      POSTGRES_DB: classquiz
    volumes:
      - data:/var/lib/postgresql/data

  proxy:
    image: caddy:alpine
    restart: always
    volumes:
      - ./Caddyfile-docker:/etc/caddy/Caddyfile
    ports:
      - "${PUBLIC_HTTP_PORT:-8080}:8080"
    depends_on:
      - frontend
      - api

  meilisearch:
    image: getmeili/meilisearch:v0.28.0
    restart: always
    environment:
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch-data:/data.ms

volumes:
  data:
  meilisearch-data:
